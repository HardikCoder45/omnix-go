<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>OmniX Go</title>
  <style>
    :root {
      --page: transparent;
      --panel: #ffffff;
      --soft: #f7f7f8;
      --soft-strong: #f1f2f4;
      --line: #e4e4e7;
      --ink: #202123;
      --muted: #6b6f76;
      --accent: #2563eb;
      --accent-strong: #1d4ed8;
      --accent-soft: rgba(37, 99, 235, .09);
      --green: #15803d;
      --green-soft: rgba(21, 128, 61, .09);
      --red: #c2413a;
      --red-soft: rgba(194, 65, 58, .08);
      --amber: #a16207;
      --cyan: #0e7490;
      --mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
      --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 30px rgba(16, 24, 40, .05);
      --code-bg: #fbfbfc;
      --code-gutter: #f4f4f6;
      --code-ink: #24262b;
      --tok-comment: #6a737d;
      --tok-string: #0a7b4f;
      --tok-keyword: #8b2bb9;
      --tok-number: #b45309;
      --tok-literal: #0969da;
      --tok-type: #9a6700;
      --tok-tag: #cf222e;
    }
    :root[data-theme="dark"] {
      --panel: #202123;
      --soft: #292a2d;
      --soft-strong: #313236;
      --line: #3a3b40;
      --ink: #f4f4f5;
      --muted: #a6a7ad;
      --accent: #7db4ff;
      --accent-strong: #a8ccff;
      --accent-soft: rgba(96, 165, 250, .14);
      --green: #69d98b;
      --green-soft: rgba(105, 217, 139, .11);
      --red: #ff8b84;
      --red-soft: rgba(255, 139, 132, .1);
      --amber: #f2c45d;
      --cyan: #5dd5ee;
      --shadow: none;
      --code-bg: #111317;
      --code-gutter: #171a1f;
      --code-ink: #e6edf3;
      --tok-comment: #8b949e;
      --tok-string: #a5d6a7;
      --tok-keyword: #d2a8ff;
      --tok-number: #ffa657;
      --tok-literal: #79c0ff;
      --tok-type: #e3b341;
      --tok-tag: #ff7b72;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-width: 0; }
    body {
      background: var(--page);
      color: var(--ink);
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .shell {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    .shell[data-expandable="true"] { cursor: pointer; }
    .shell[data-expandable="true"]:hover {
      border-color: color-mix(in srgb, var(--ink) 18%, var(--line));
    }
    .shell[data-expandable="true"]:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 70%, transparent);
      outline-offset: 2px;
    }
    .masthead {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
    }
    .mark {
      width: 34px;
      height: 34px;
      display: block;
      object-fit: cover;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--soft);
      box-shadow: 0 2px 8px rgba(16, 24, 40, .12);
    }
    .heading { min-width: 0; }
    .brand {
      margin: 0;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -.015em;
    }
    .action {
      margin-top: 2px;
      overflow-wrap: anywhere;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 22px;
      padding: 2px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--soft);
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }
    .status[data-state="working"] { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); background: var(--accent-soft); }
    .status[data-state="done"] { color: var(--green); border-color: color-mix(in srgb, var(--green) 34%, var(--line)); background: var(--green-soft); }
    .status[data-state="error"] { color: var(--red); border-color: color-mix(in srgb, var(--red) 34%, var(--line)); background: var(--red-soft); }
    .content {
      min-width: 0;
      border-top: 1px solid var(--line);
      overflow: visible;
    }
    .long-content { min-width: 0; }
    .long-content-body { min-width: 0; }
    .long-content.is-collapsed .long-content-body {
      position: relative;
      max-height: 260px;
      overflow: hidden;
    }
    .long-content.is-collapsed .long-content-body::after {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 58px;
      pointer-events: none;
      background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--panel) 98%, transparent));
      content: "";
    }
    .long-content-hint {
      height: 28px;
      display: grid;
      place-items: center;
      border-top: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
    }
    .long-content-hint span {
      display: block;
      font-size: 17px;
      line-height: 1;
      opacity: .72;
      transition: transform .2s ease, opacity .18s ease;
    }
    .shell[data-expandable="true"]:hover .long-content-hint span { opacity: 1; }
    .long-content.is-expanded .long-content-hint span { transform: rotate(180deg); }
    .empty {
      min-height: 92px;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--soft);
      color: var(--muted);
      font-size: 11px;
    }
    .path {
      min-width: 0;
      color: var(--ink);
      font-family: var(--mono);
      font-size: 11px;
      overflow-wrap: anywhere;
    }
    .badge {
      flex: 0 0 auto;
      padding: 2px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .02em;
    }
    .badge.ok { color: var(--green); border-color: color-mix(in srgb, var(--green) 48%, var(--line)); }
    .badge.error { color: var(--red); border-color: color-mix(in srgb, var(--red) 48%, var(--line)); }
    pre {
      margin: 0;
      padding: 12px 14px;
      font: 11px/1.6 var(--mono);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      tab-size: 2;
    }
    .editor {
      min-width: 0;
      background: var(--code-bg);
      color: var(--code-ink);
    }
    .editor-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
      padding: 8px 11px;
      border-bottom: 1px solid var(--line);
      background: var(--code-gutter);
    }
    .editor-file { min-width: 0; display: flex; align-items: center; gap: 8px; }
    .editor-file::before {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--accent);
      content: "";
    }
    .editor-language {
      flex: 0 0 auto;
      color: var(--muted);
      font: 600 9px/1 var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .code-grid { width: 100%; padding: 7px 0 10px; overflow-x: auto; }
    .code-line {
      display: grid;
      grid-template-columns: 44px minmax(max-content, 1fr);
      min-width: 100%;
      min-height: 20px;
      font: 11px/20px var(--mono);
    }
    .code-line:hover { background: color-mix(in srgb, var(--accent) 5%, transparent); }
    .line-number {
      padding-right: 10px;
      border-right: 1px solid var(--line);
      background: var(--code-gutter);
      color: var(--muted);
      text-align: right;
      user-select: none;
    }
    .code-source {
      min-width: 0;
      padding: 0 12px;
      color: var(--code-ink);
      white-space: pre;
      tab-size: 2;
    }
    .tok-comment { color: var(--tok-comment); font-style: italic; }
    .tok-string { color: var(--tok-string); }
    .tok-keyword { color: var(--tok-keyword); font-weight: 600; }
    .tok-number { color: var(--tok-number); }
    .tok-literal { color: var(--tok-literal); }
    .tok-type { color: var(--tok-type); }
    .tok-tag { color: var(--tok-tag); }
    .terminal-window {
      min-width: 0;
      overflow: hidden;
      background: #0d0f12;
      color: #e6edf3;
    }
    .terminal-titlebar {
      min-height: 34px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      border-bottom: 1px solid #2b3038;
      background: #171a1f;
    }
    .terminal-dots { display: flex; gap: 5px; }
    .terminal-dots i { width: 8px; height: 8px; display: block; border-radius: 50%; background: #59606b; }
    .terminal-dots i:first-child { background: #ff6b63; }
    .terminal-dots i:nth-child(2) { background: #e7b94d; }
    .terminal-dots i:last-child { background: #55c36a; }
    .terminal-title {
      min-width: 0;
      overflow: hidden;
      color: #9da5b0;
      font: 10px/1.3 var(--mono);
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .terminal-command {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      gap: 5px;
      padding: 10px 12px;
      border-bottom: 1px solid #242931;
      background: #111419;
      font: 11px/1.55 var(--mono);
    }
    .terminal-prompt { color: #55c36a; font-weight: 700; user-select: none; }
    .terminal-command code { color: #f0f4f8; white-space: pre-wrap; overflow-wrap: anywhere; }
    .terminal-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      padding: 6px 12px;
      border-bottom: 1px solid #242931;
      color: #8b949e;
      font: 9px/1.4 var(--mono);
    }
    .terminal-output {
      min-height: 46px;
      margin: 0;
      padding: 11px 12px 13px;
      color: #dce3ea;
      font: 11px/1.58 var(--mono);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      tab-size: 2;
    }
    .terminal-output.is-empty { color: #737b86; font-style: italic; }
    .terminal-live { display: inline-flex; align-items: center; gap: 6px; color: #79c0ff; }
    .terminal-live::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 0 rgba(121, 192, 255, .45);
      animation: live-pulse 1.2s infinite;
      content: "";
    }
    @keyframes live-pulse { 70% { box-shadow: 0 0 0 6px rgba(121, 192, 255, 0); } }
    .terminal-diff { background: var(--panel); color: var(--ink); }
    .evaluation { display: grid; gap: 9px; padding: 9px; background: var(--soft); }
    .evaluation-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 2px 2px 0;
      color: var(--muted);
      font-size: 11px;
    }
    .evaluation-list { display: grid; gap: 9px; }
    .evaluation-item { overflow: hidden; border: 1px solid var(--line); border-radius: 11px; box-shadow: 0 1px 2px rgba(16,24,40,.04); }
    .diff-files { display: grid; gap: 9px; padding: 9px; }
    .diff-file {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
    }
    .diff-file-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 8px 11px;
      border-bottom: 1px solid var(--line);
      background: var(--soft);
    }
    .diff-stat { display: flex; gap: 8px; font: 11px var(--mono); }
    .plus { color: var(--green); }
    .minus { color: var(--red); }
    .diff-lines { width: 100%; min-width: 0; }
    .diff-line {
      display: grid;
      grid-template-columns: 34px 34px 20px minmax(0, 1fr);
      min-width: 0;
      min-height: 20px;
      border-left: 3px solid transparent;
      font: 11px/20px var(--mono);
    }
    .diff-line .ln {
      padding: 0 5px;
      border-right: 1px solid var(--line);
      color: var(--muted);
      text-align: right;
      user-select: none;
    }
    .diff-marker { color: var(--muted); text-align: center; user-select: none; }
    .diff-line code {
      display: block;
      min-width: 0;
      padding: 0 10px 0 2px;
      color: var(--ink);
      font: inherit;
      white-space: pre;
      overflow-x: auto;
    }
    .diff-line.add { border-left-color: var(--green); background: color-mix(in srgb, var(--green) 13%, var(--panel)); }
    .diff-line.del { border-left-color: var(--red); background: color-mix(in srgb, var(--red) 12%, var(--panel)); }
    .diff-line.add .diff-marker { color: var(--green); font-weight: 800; }
    .diff-line.del .diff-marker { color: var(--red); font-weight: 800; }
    .diff-line.hunk { border-left-color: var(--accent); background: var(--accent-soft); }
    .diff-line.hunk code, .diff-line.hunk .diff-marker { color: var(--cyan); }
    .diff-line.meta code { color: var(--muted); }
    .list { display: grid; }
    .list-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
    }
    .list-row:last-child { border-bottom: 0; }
    .list-main { min-width: 0; }
    .list-title {
      color: var(--ink);
      font-size: 12px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    .list-copy {
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .list-side { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 9px;
      padding: 10px;
    }
    .card {
      min-width: 0;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
    }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .card strong { display: block; min-width: 0; font-size: 12px; overflow-wrap: anywhere; }
    .card p { margin: 5px 0 0; color: var(--muted); font-size: 11px; line-height: 1.45; overflow-wrap: anywhere; }
    .agent-field { margin-top: 8px; }
    .agent-label { display: block; margin-bottom: 2px; color: var(--muted); font-size: 9px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    .agent-value { color: var(--ink); font-size: 11px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
    .agent-meta { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 7px; color: var(--muted); font-size: 10px; }
    .agent-controls { display: grid; grid-template-columns: 1fr auto; gap: 7px; margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line); }
    .agent-follow-up { min-height: 48px; resize: vertical; border: 1px solid var(--line); border-radius: 9px; padding: 8px 9px; background: var(--soft); color: var(--ink); font: inherit; font-size: 11px; line-height: 1.4; outline: none; }
    .agent-follow-up:focus { border-color: var(--accent); }
    .agent-actions { display: flex; flex-direction: column; gap: 6px; }
    .agent-button { border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; background: var(--panel); color: var(--ink); font: inherit; font-size: 10px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .agent-button:hover:not(:disabled) { background: var(--soft); }
    .agent-button:disabled { opacity: .48; cursor: default; }
    .agent-button.primary { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); color: var(--accent); }
    .agent-button.stop { color: var(--red); }
    .agent-control-status { grid-column: 1 / -1; min-height: 14px; color: var(--muted); font-size: 10px; }
    .plan-stack { display: grid; gap: 10px; padding: 10px; }
    .plan-board { overflow: hidden; border: 1px solid var(--line); border-radius: 12px; }
    .plan-summary {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      padding: 12px 13px;
      border-bottom: 1px solid var(--line);
      background: var(--soft);
    }
    .plan-goal { margin: 0; font-size: 13px; line-height: 1.4; }
    .plan-progress { flex: 0 0 auto; color: var(--accent); font-size: 11px; font-weight: 700; white-space: nowrap; }
    .plan-step {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) auto;
      gap: 9px;
      align-items: start;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }
    .plan-step:last-child { border-bottom: 0; }
    .check {
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--soft);
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
    }
    .plan-step.completed .check { border-color: var(--green); background: var(--green); color: #fff; }
    .plan-step.in-progress .check { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .plan-step.blocked .check { border-color: var(--red); background: var(--red-soft); color: var(--red); }
    .step-copy { min-width: 0; }
    .step-copy strong { display: block; font-size: 12px; line-height: 1.4; }
    .step-copy p { margin: 3px 0 0; color: var(--muted); font-size: 11px; line-height: 1.45; overflow-wrap: anywhere; }
    .step-state { padding-top: 2px; color: var(--muted); font-size: 10px; font-weight: 600; white-space: nowrap; }
    .plan-step.completed .step-state { color: var(--green); }
    .plan-step.in-progress .step-state { color: var(--accent); }
    .plan-step.blocked .step-state { color: var(--red); }
    .plan-outcome { padding: 10px 12px; border-top: 1px solid var(--line); background: var(--green-soft); }
    .plan-outcome strong { color: var(--green); font-size: 11px; }
    .plan-outcome p { margin: 4px 0 0; font-size: 12px; line-height: 1.45; }
    .image-wrap { padding: 10px; }
    .image-wrap img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #000;
    }
    .object-list { display: grid; padding: 4px 12px 12px; }
    .object-group { min-width: 0; padding: 8px 0 0; }
    .object-row {
      display: grid;
      grid-template-columns: minmax(88px, .34fr) minmax(0, 1fr);
      gap: 10px;
      padding: 5px 0;
      border-bottom: 1px solid var(--line);
    }
    .object-row:last-child { border-bottom: 0; }
    .object-key { color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
    .object-value { min-width: 0; font-size: 11px; overflow-wrap: anywhere; white-space: pre-wrap; }
    .nested { margin-left: 10px; padding-left: 10px; border-left: 2px solid var(--line); }
    @media (max-width: 520px) {
      .shell { border-radius: 14px; }
      .masthead { grid-template-columns: 32px minmax(0, 1fr); padding: 9px 10px; }
      .mark { width: 32px; height: 32px; border-radius: 50%; }
      .status { grid-column: 2; justify-self: start; margin-top: 2px; }
      .cards { grid-template-columns: 1fr; }
      .plan-step { grid-template-columns: 22px minmax(0, 1fr); }
      .step-state { grid-column: 2; }
      .object-row { grid-template-columns: 1fr; gap: 2px; }
      .diff-line { grid-template-columns: 28px 28px 18px minmax(0, 1fr); }
    }
  </style>
</head>
<body>

        const cards = [];
        for (const workflow of workflows) cards.push(`<article class="card"><div class="card-top"><strong>${escapeHtml(workflow?.name || "Workflow")}</strong><span class="badge ok">${escapeHtml(list(workflow?.nodes).length)} nodes</span></div><p>${escapeHtml(workflow?.description || `${list(workflow?.edges).length} graph connections`)}</p></article>`);
        for (const schedule of schedules) cards.push(`<article class="card"><div class="card-top"><strong>${escapeHtml(schedule?.name || "Schedule")}</strong><span class="badge ${schedule?.enabled ? "ok" : ""}">${schedule?.enabled ? "Enabled" : "Paused"}</span></div><p>${escapeHtml(schedule?.cron || "")} · ${escapeHtml(schedule?.timezone || "")}${schedule?.nextRunAt ? `<br>Next ${escapeHtml(new Date(schedule.nextRunAt).toLocaleString())}` : ""}</p></article>`);
        for (const run of runs) {
          const nodeRuns = Object.values(run?.nodeRuns || {});
          const completed = nodeRuns.filter((node) => node?.status === "completed").length;
          const failed = run?.status === "failed" || run?.status === "cancelled";
          cards.push(`<article class="card"><div class="card-top"><strong>${escapeHtml(run?.workflowName || "Workflow run")}</strong><span class="badge ${failed ? "error" : run?.status === "completed" ? "ok" : ""}">${escapeHtml(run?.status || "queued")}</span></div><p>${escapeHtml(completed)} of ${escapeHtml(nodeRuns.length)} nodes complete${run?.error ? `<br>${escapeHtml(run.error)}` : ""}</p></article>`);
        }
        for (const agent of agents) cards.push(`<article class="card"><div class="card-top"><strong>${escapeHtml(agent?.name || agent?.agentName || "Custom agent")}</strong><span class="badge ok">Agent</span></div><p>${escapeHtml(agent?.description || agent?.latestAssistant || agent?.prompt || "Ready")}</p>${agent?.conversationId ? `<p>Chat ${escapeHtml(agent.conversationId)}</p>` : ""}</article>`);
        if (!cards.length) return renderObject(output);
        return `<div class="cards">${cards.join("")}</div>`;
      }
      function gitStateLabel(code) {
        const state = String(code || "").trim();
        if (state === "##") return "Branch";
        if (state.includes("??")) return "New";
        if (state.includes("D")) return "Removed";
        if (state.includes("R")) return "Renamed";
        if (state.includes("A")) return "Added";
        if (state.includes("M")) return "Changed";
        return "Updated";
      }
      function renderGitStatus(output) {
        const rows = String(output?.status || "").split("\n").filter(Boolean);
        if (!rows.length) return `<div class="empty">No changed files.</div>`;
        return `<div class="list">${rows.map((row) => `
          <div class="list-row"><div class="list-main"><div class="list-title">${escapeHtml(row.slice(3) || row)}</div></div><div class="list-side">${escapeHtml(gitStateLabel(row.slice(0, 2)))}</div></div>`).join("")}</div>`;
      }
      function renderImage() {
        const image = imageItem();
        if (!image) return `<div class="empty">No image to show.</div>`;
        const src = `data:${image.mimeType || "image/png"};base64,${image.data}`;
        return `<div class="image-wrap"><img src="${src}" alt="Captured computer screen"></div>`;
      }
      function primitiveText(value) {
        if (value === null) return "None";
        if (typeof value === "boolean") return value ? "Yes" : "No";
        return String(value);
      }
      function renderObjectRows(value, depth = 0, keyName = "") {
        if (secretKey.test(keyName)) return `<div class="object-value">[redacted]</div>`;
        if (depth > 4) return `<div class="object-value">…</div>`;
        if (Array.isArray(value)) {
          return `<div class="object-group ${depth ? "nested" : ""}">${value.map((item, index) =>
            item && typeof item === "object"
              ? `<div class="object-row"><div class="object-key">Item ${index + 1}</div><div>${renderObjectRows(item, depth + 1)}</div></div>`
              : `<div class="object-row"><div class="object-key">Item ${index + 1}</div><div class="object-value">${escapeHtml(primitiveText(item))}</div></div>`
          ).join("")}</div>`;
        }
        if (value && typeof value === "object") {
          return `<div class="object-group ${depth ? "nested" : ""}">${Object.entries(value).map(([key, child]) =>
            child && typeof child === "object"
              ? `<div class="object-row"><div class="object-key">${escapeHtml(key.replaceAll("_", " "))}</div><div>${renderObjectRows(child, depth + 1, key)}</div></div>`
              : `<div class="object-row"><div class="object-key">${escapeHtml(key.replaceAll("_", " "))}</div><div class="object-value">${secretKey.test(key) ? "[redacted]" : escapeHtml(primitiveText(child))}</div></div>`
          ).join("")}</div>`;
        }
        return `<div class="object-value">${escapeHtml(primitiveText(value))}</div>`;
      }
      function renderObject(output) {
        return `<div class="object-list">${renderObjectRows(output)}</div>`;
      }
      function renderContent(kind, output, input) {
        if (!output && state.progress.active) {
          if (kind === "evaluation") return renderEvaluation({ results: [] }, input);
          return renderTerminal({ running: true, output: state.progress.output }, input);
        }
        if (!output && !imageItem()) return `<div class="empty">Working on it…</div>`;
        if (kind === "plan") return renderPlan(output);
        if (kind === "diff") return renderDiff(output, input);
        if (kind === "terminal") return renderTerminal(output, input);
        if (kind === "evaluation") return renderEvaluation(output, input);
        if (kind === "directory") return renderDirectory(output);
        if (kind === "search") return renderSearch(output);
        if (kind === "activity") return renderActivity(output);
        if (kind === "skills") return renderSkills(output);
        if (kind === "agents") return renderAgents(output);
        if (kind === "connections") return renderConnections(output);
        if (kind === "automation") return renderAutomation(output);
        if (kind === "git-status") return renderGitStatus(output);
        if (kind === "code") return renderCode(output, input);
        if (kind === "image") return renderImage();
        if (kind === "text") return `<pre>${escapeHtml(output)}</pre>`;
        return renderObject(output);
      }
      function callToolOutput(result) {
        return result?.structuredContent ?? result?.result?.structuredContent ?? result ?? null;
      }
      function applyAgentToolOutput(payload, reference) {
        const nextTask = payload?.task ?? payload;
        if (!nextTask || typeof nextTask !== "object" || !nextTask.id) return;
        const current = normalizedOutput();
        if (Array.isArray(current?.tasks)) {
          const found = current.tasks.some((task) => task?.id === nextTask.id || task?.id === reference || task?.conversationId === reference);
          state.output = {
            ...current,
            tasks: found
              ? current.tasks.map((task) =>
                  task?.id === nextTask.id || task?.id === reference || task?.conversationId === reference
                    ? nextTask
                    : task)
              : [...current.tasks, nextTask],
          };
        } else {
          state.output = nextTask;
        }
      }
      async function runAgentAction(button) {
        const controls = button.closest(".agent-controls");
        const reference = controls?.dataset.agentReference;
        const status = controls?.querySelector(".agent-control-status");
        const input = controls?.querySelector(".agent-follow-up");
        const action = button.dataset.agentAction;
        if (!reference || typeof window.openai?.callTool !== "function") return;
        let tool;
        let args;
        let pending;
        if (action === "follow-up") {
          const prompt = input?.value?.trim();
          if (!prompt) {
            if (status) status.textContent = "Type a follow-up instruction first.";
            input?.focus();
            return;
          }
          tool = "follow_up_agent";
          args = { agent: reference, prompt };
          pending = "Sending follow-up…";
        } else if (action === "refresh") {
          tool = "agent_status";
          args = { agent: reference };
          pending = "Refreshing scraped ChatGPT state…";
        } else if (action === "stop") {
          tool = "cancel_agent";
          args = { agent: reference };
          pending = "Stopping ChatGPT generation…";
        } else {
          return;
        }
        controls.querySelectorAll("button,textarea").forEach((element) => { element.disabled = true; });
        if (status) status.textContent = pending;
        try {
          const result = await window.openai.callTool(tool, args);
          const payload = callToolOutput(result);
          applyAgentToolOutput(payload, reference);
          if (action === "follow-up" && input) input.value = "";
          safeRender();
        } catch (error) {
          controls.querySelectorAll("button,textarea").forEach((element) => { element.disabled = false; });
          if (status) status.textContent = `Could not ${action === "stop" ? "stop" : action === "refresh" ? "refresh" : "send follow-up"}: ${String(error?.message || error)}`;
          notify();
        }
      }
      function render() {
        const output = normalizedOutput();
        const input = inputArgs();
        const metaCode = state.metadata?.omnixGo || {};
        const tool =
          (typeof metaCode.toolName === "string" && metaCode.toolName) ||
          (configuredTool === "omnix-go" ? "" : configuredTool);
        const kind =
          configuredView !== "auto"
            ? configuredView === "mcp" ? "connections" : configuredView
            : typeof metaCode.view === "string" && metaCode.view && metaCode.view !== "auto"
              ? metaCode.view === "mcp" ? "connections" : metaCode.view
              : infer(output, input);
        document.documentElement.dataset.theme = window.openai?.theme || (
          matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"
        );
        $("#action").textContent = actionFor(tool, kind);
        const result = resultState(output);
        $("#status").dataset.state = result.state;
        $("#status-text").textContent = result.label;
        $("#content").innerHTML = renderContent(kind, output, input);
        $("#content").querySelectorAll("img").forEach((image) => image.addEventListener("load", notify, { once: true }));
        enhanceLongContent();
        notify();
      }
      function fallback(error) {
        document.documentElement.dataset.theme = window.openai?.theme || "light";
        $("#action").textContent = "Showing the result";
        $("#status").dataset.state = "error";
        $("#status-text").textContent = "Needs attention";
        $("#content").innerHTML = `<pre>${escapeHtml(String(error?.message || error))}</pre>`;
        notify();
      }
      function safeRender() {
        try { render(); } catch (error) { fallback(error); }
      }
      function resetProgress() {
        Object.assign(state.progress, {
          active: false,
          output: "",
          chunks: 0,
          bytes: 0,
          progress: 0,
          total: null,
          message: "",
          command: "",
          cwd: "",
          sessionId: "",
          stream: "stdout",
          kind: "terminal",
        });
      }
      function parseProgressMessage(message) {
        if (typeof message !== "string") return message && typeof message === "object" ? message : {};
        try { return JSON.parse(message); } catch { return { message }; }
      }
      function acceptProgress(params) {
        const payload = parseProgressMessage(params?.message ?? params);
        state.progress.active = true;
        state.progress.progress = Number(params?.progress ?? state.progress.progress) || 0;
        state.progress.total = Number.isFinite(Number(params?.total)) ? Number(params.total) : state.progress.total;
        state.progress.message = payload?.message || payload?.stage || params?.message || "Receiving output";
        state.progress.kind = payload?.type === "omnix/evaluation-progress" ? "evaluation" : "terminal";
        if (payload?.stage === "command-start") state.progress.output = "";
        if (typeof payload?.command === "string") state.progress.command = payload.command;
        if (typeof payload?.cwd === "string") state.progress.cwd = payload.cwd;
        if (typeof payload?.sessionId === "string") state.progress.sessionId = payload.sessionId;
        if (typeof payload?.stream === "string") state.progress.stream = payload.stream;
        if (typeof payload?.text === "string" && payload.text) {
          state.progress.output = truncate(state.progress.output + payload.text, 250000);
          state.progress.chunks += 1;
          state.progress.bytes += new TextEncoder().encode(payload.text).length;
        }
        safeRender();
      }
      function acceptGlobals(globals) {
        if (!globals) return;
        if ("toolInput" in globals) state.input = globals.toolInput;
        if ("toolOutput" in globals) {
          state.output = globals.toolOutput;
          if (globals.toolOutput !== null && globals.toolOutput !== undefined) resetProgress();
        }
        if ("toolResponseMetadata" in globals) state.metadata = globals.toolResponseMetadata;
        if (globals.toolProgress) acceptProgress(globals.toolProgress);
        if (globals.theme) document.documentElement.dataset.theme = globals.theme;
        safeRender();
      }
      document.addEventListener("click", (event) => {
        const button = event.target.closest?.("[data-agent-action]");
        if (button) void runAgentAction(button);
      });
      document.addEventListener("keydown", (event) => {
        if (!(event.metaKey || event.ctrlKey) || event.key !== "Enter") return;
        const input = event.target.closest?.(".agent-follow-up");
        if (!input) return;
        const button = input.closest(".agent-controls")?.querySelector('[data-agent-action="follow-up"]');
        if (!button || button.disabled) return;
        event.preventDefault();
        void runAgentAction(button);
      });
      window.addEventListener("openai:set_globals", (event) => acceptGlobals(event.detail?.globals));
      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;
        if (message.method === "ui/notifications/tool-input") state.input = message.params?.arguments ?? message.params;
        if (message.method === "ui/notifications/tool-result") {
          state.output = message.params?.structuredContent ?? null;
          state.metadata = message.params;
          resetProgress();
        }
        if (["notifications/progress", "ui/notifications/progress", "ui/notifications/tool-progress"].includes(message.method)) {
          acceptProgress(message.params);
          return;
        }
        if (message.method === "ui/notifications/tool-input" || message.method === "ui/notifications/tool-result") safeRender();
      }, { passive: true });
      try {
        window.parent.postMessage({
          jsonrpc: "2.0",
          id: "omnix-ui-init",
          method: "ui/initialize",
          params: {
            appInfo: { name: "omnix-go-result", version: "4.2.0" },
            appCapabilities: {},
          },
        }, "*");
      } catch { /* host optional */ }
      if (typeof ResizeObserver !== "undefined") {
        const observer = new ResizeObserver(notify);
        observer.observe(document.documentElement);
        observer.observe(document.body);
      }
      window.addEventListener("load", notify, { once: true });
      safeRender();
    })();
  </script>
</body>
</html>
