[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "omnix-go"
version = "0.3.4"
description = "Self-bootstrapping Python installer shim for the OmniX Go private MCP harness"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "OmniX Go contributors" }]

[project.scripts]
omnix-go = "omnix_go:main"

[tool.hatch.build.targets.wheel]
packages = ["omnix_go"]
